name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The gateway e2e projects run the gateway from source
      - name: Check out the gateway
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Simple-Irc-Client/gateway
          path: gateway-src

      - name: Install gateway dependencies
        run: pnpm install --frozen-lockfile
        working-directory: gateway-src

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      # Firefox runs Web Audio only with a sound device; the runner has none, so PulseAudio gives it a silent one
      - name: Start a virtual sound device
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl info

      - name: Pull IRC server images
        run: |
          docker pull ghcr.io/ergochat/ergo:stable
          docker pull docker.io/linuxserver/ngircd:version-27-r1
          docker pull codeberg.org/emersion/soju:v0.11.1

      - name: Run e2e tests
        run: pnpm exec playwright test
        env:
          E2E_GATEWAY_DIR: ${{ github.workspace }}/gateway-src

      # - name: Upload test results
      #   uses: actions/upload-artifact@v7
