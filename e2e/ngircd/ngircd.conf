# A server without IRCv3: no message tags, server-time, echo-message, SASL, MONITOR or WATCH
[Global]
	Name = irc.legacy.test
	Info = Legacy E2E Test IRC Server
	AdminInfo1 = Simple IRC Client E2E
	AdminEMail = e2e@localhost
	Ports = 6667
	MotdPhrase = Welcome to the legacy E2E Test IRC Server

[Limits]
	MaxNickLength = 30
	# Every test client connects from the same address
	MaxConnectionsIP = 0
	# Throttling would only slow the suite down
	MaxPenaltyTime = 0

[Options]
	DNS = no
	Ident = no
	PAM = no
	MorePrivacy = no
